name: Links

on:
  pull_request:
    branches: [main]
    paths: ["**.md", "lychee.toml"]
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml README.md README.zh-CN.md CONTRIBUTING.md
          output: ./lychee-report.md
          format: markdown
          fail: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find an open link report issue
        id: find
        if: github.event_name != 'pull_request' && steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number=$(gh issue list --repo "${{ github.repository }}" --state open --label "link report" --json number --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Open or update the link report issue
        if: github.event_name != 'pull_request' && steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Link checker report
          content-filepath: ./lychee-report.md
          issue-number: ${{ steps.find.outputs.number }}
          labels: link report, automated issue
