name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "README.zh-CN.md"
      - "site/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # splits README.md / README.zh-CN.md into pages, checks entry counts, builds
      # (VitePress fails the build on dead internal links)
      - run: npm run docs:build
      - uses: actions/upload-pages-artifact@v5
        if: vars.PAGES_ENABLED == 'true'
        with:
          path: site/.vitepress/dist

  # Deploy only after Pages is enabled (Settings -> Pages -> Source: GitHub Actions)
  # and the repository variable PAGES_ENABLED is set to "true". Until then the
  # build job still runs as a check, so pushes stay green.
  deploy:
    needs: build
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
