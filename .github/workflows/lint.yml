name: Lint

on:
  pull_request:
    branches: [main]
    paths: ["README.md"]
  push:
    branches: [main]
    paths: ["README.md"]

permissions:
  contents: read

jobs:
  awesome-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npx --yes awesome-lint README.md
